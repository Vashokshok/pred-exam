<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
<h2>Страница Автомобилей</h2>

{% for dealer in dealers %}
<div>
    <h3>{{dealer.name}}</h3>
    <p> {{dealer.city}} - {{dealer.address}}</p>

    <a href="{{ url_for('cars.add_auto') }}">Добавить нового Диллера</a>
    <a href="{{ url_for('cars.auto_delete', id=dealer.id) }}">Удалить машину</a>

</div>
{% endfor %}


</body>
</html>
